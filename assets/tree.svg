<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600">
  <defs>
    <!-- Trunk Gradient -->
    <linearGradient id="trunkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5D4037" />
      <stop offset="50%" stop-color="#795548" />
      <stop offset="100%" stop-color="#4E342E" />
    </linearGradient>
    <!-- Canopy Gradient 1 -->
    <radialGradient id="leaf1" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#81C784" />
      <stop offset="100%" stop-color="#4CAF50" />
    </radialGradient>
    <!-- Canopy Gradient 2 -->
    <radialGradient id="leaf2" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#66BB6A" />
      <stop offset="100%" stop-color="#43A047" />
    </radialGradient>
    <!-- Canopy Gradient 3 -->
    <radialGradient id="leaf3" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#4CAF50" />
      <stop offset="100%" stop-color="#2E7D32" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Shadow on the ground -->
  <ellipse cx="250" cy="580" rx="150" ry="20" fill="rgba(0,0,0,0.15)" />

  <!-- Trunk -->
  <path d="M 210,580 C 210,400 170,250 250,150 C 330,250 290,400 290,580 Z" fill="url(#trunkGrad)" />
  <!-- Trunk Lines (Bark texture) -->
  <path d="M 230,580 C 230,450 200,300 250,200" stroke="#3E2723" stroke-width="4" fill="none" opacity="0.4" stroke-linecap="round"/>
  <path d="M 270,580 C 270,450 290,300 250,200" stroke="#3E2723" stroke-width="4" fill="none" opacity="0.4" stroke-linecap="round"/>

  <!-- Left Branch -->
  <path d="M 230,300 C 150,280 100,200 100,200" stroke="url(#trunkGrad)" stroke-width="25" fill="none" stroke-linecap="round" />
  <!-- Right Branch -->
  <path d="M 270,280 C 350,250 400,180 400,180" stroke="url(#trunkGrad)" stroke-width="20" fill="none" stroke-linecap="round" />

  <!-- Canopy Clouds (using filters for shadow) -->
  <g filter="url(#shadow)">
    <!-- Back layer -->
    <circle cx="150" cy="250" r="100" fill="url(#leaf3)" />
    <circle cx="350" cy="230" r="110" fill="url(#leaf3)" />
    
    <!-- Mid layer -->
    <circle cx="250" cy="150" r="130" fill="url(#leaf2)" />
    <circle cx="120" cy="160" r="90" fill="url(#leaf2)" />
    <circle cx="380" cy="150" r="90" fill="url(#leaf2)" />

    <!-- Front layer -->
    <circle cx="200" cy="220" r="110" fill="url(#leaf1)" />
    <circle cx="300" cy="200" r="105" fill="url(#leaf1)" />
    <circle cx="250" cy="80" r="90" fill="url(#leaf1)" />
  </g>
</svg>
